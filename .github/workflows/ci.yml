name: CI

on:
  push:
    branches: [main]
    # A docs-only push cannot break the gate, and the "record the SHA" commit
    # that follows every backlog item touches nothing else. Skipping those
    # halves the run count on its own.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Pushing twice in quick succession should not pay for the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookable_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bookable_ci
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookable_ci_shadow
  # Signs the staff session cookie (D-9). A throwaway value for CI only — the
  # app refuses to run without one rather than falling back to a default, and
  # a real deployment sets a real secret. Safe to have in the workflow file
  # BECAUSE it is worthless: it signs nothing that outlives the job.
  SESSION_SECRET: ci-only-session-secret-not-used-anywhere-real
  # Gates the reminder job route (A-022). Same reasoning as SESSION_SECRET
  # above — a throwaway value, safe in the workflow file because it protects
  # nothing that outlives the job.
  CRON_SECRET: ci-only-cron-secret-not-used-anywhere-real

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Migrations from scratch against a throwaway Postgres, then drift check:
      # schema.prisma must match what the committed migration history produces.
      - name: Create throwaway databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE bookable_ci;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE bookable_ci_shadow;"

      - name: Apply migrations from scratch
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      # Generated by `postinstall` during `npm ci`. Asserted rather than
      # re-run: every one of this workflow's first ten failures was a
      # gitignored generated artifact that existed locally and not here.
      - name: Assert generated artifacts exist
        run: test -d packages/db/generated/client || (echo "Prisma client missing - postinstall did not run" && exit 1)

      # The hand-written objects Prisma cannot express (A-003). If a future
      # migration drops one, the constraint tests would still pass against a
      # stale database — this asserts they exist in a DB built from scratch.
      - name: Assert the hand-written invariants exist
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d bookable_ci -v ON_ERROR_STOP=1 <<'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='appointment_block_no_overlap') THEN
              RAISE EXCEPTION 'appointment_block_no_overlap constraint is missing';
            END IF;
            -- A-030/D-29 moved the invariant to AppointmentBlock. Assert the OLD
            -- one is gone as well as the new one present: two live constraints
            -- would mean the migration half-applied, and the stricter one would
            -- quietly refuse every gap booking the feature exists to allow.
            IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='appointment_no_overlap') THEN
              RAISE EXCEPTION 'the pre-A-030 appointment_no_overlap constraint is still present';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='appointment_blocked_range') THEN
              RAISE EXCEPTION 'appointment_blocked_range trigger is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='appointment_blocks') THEN
              RAISE EXCEPTION 'appointment_blocks trigger is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='appointment_event_no_update_delete') THEN
              RAISE EXCEPTION 'AppointmentEvent append-only trigger is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname='btree_gist') THEN
              RAISE EXCEPTION 'btree_gist extension is missing';
            END IF;
          END $$;
          EOSQL

      - name: Drift check (schema.prisma vs migration history)
        run: >
          npx prisma migrate diff
          --from-migrations packages/db/prisma/migrations
          --to-schema-datamodel packages/db/prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      # D-3: the suite must be byte-identical under any process TZ. A UTC-only
      # CI hides exactly the bugs this project exists to catch.
      - name: Unit suite — TZ=UTC
        run: npm test
        env:
          TZ: UTC
      - name: Unit suite — TZ=Pacific/Kiritimati
        run: npm test
        env:
          TZ: Pacific/Kiritimati

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: e2e (production build, port 3300)
        run: npm run test:e2e
        env:
          CI: true
          PORT: 3300
